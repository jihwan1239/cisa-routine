<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16233A; --muted:#5D6B80; --line:#D5DBE4;
  --ok:#0E7A53; --ok-bg:#DDF1E7; --bad:#C0322B; --bad-bg:#F9E0DE; --frz:#3D6FB8; --frz-bg:#DCE8F7; --fire:#E8590C;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F1724; --surface:#172236; --ink:#E6ECF5; --muted:#95A3B8; --line:#26344B;
         --ok:#4CC38A; --ok-bg:#123528; --bad:#F07A72; --bad-bg:#3A1B1A; --frz:#7FA8E6; --frz-bg:#1A2A45; --fire:#FF8A3D; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(88px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.4rem;line-height:1.45;font-weight:700;margin:0 0 8px;letter-spacing:-.01em;word-break:keep-all}
h1.q{font-size:1.12rem;font-weight:500;line-height:1.65;margin:4px 0 16px}
h2{font-size:1.05rem;margin:30px 0 8px;font-weight:700}
p{margin:0 0 10px;word-break:keep-all}
.muted{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:8px;min-height:46px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>.btn{flex:1 1 0;min-width:96px}
.between{justify-content:space-between;align-items:center}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .3s}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
textarea{min-height:84px;resize:vertical}
textarea.code{font-size:.78rem;min-height:70px;word-break:break-all}
label{display:block;margin:14px 0 4px;font-size:.9rem;color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{background:none;border:0;padding:14px 0 12px;font-size:.85rem;color:var(--muted);box-shadow:inset 0 3px 0 transparent}
.tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ink)}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;margin:8px 0;
  border:1px solid var(--line);background:var(--surface);border-radius:8px;word-break:keep-all}
.ch b{flex:none;width:22px;color:var(--muted);font-weight:500}
.ch.right{border-color:var(--ok);background:var(--ok-bg)}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ch.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ch:disabled{cursor:default;color:var(--ink)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.warn{border-color:var(--bad);background:var(--bad-bg)}
.ai{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.face{font-size:1.2rem;line-height:1.6;min-height:120px;display:flex;align-items:center;word-break:keep-all;white-space:pre-wrap}
/* 연속 기록 */
.streak{display:flex;align-items:center;gap:14px}
.streak .fl{font-size:2.6rem;line-height:1;filter:grayscale(1);opacity:.45}
.streak.lit .fl{filter:none;opacity:1}
.streak .n{font-size:3.2rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.streak.lit .n{color:var(--fire)}
.streak .u{color:var(--muted);font-size:.95rem}
.streak .frz{margin-left:auto;text-align:right;font-size:.85rem;color:var(--frz)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;text-align:center;font-size:.78rem;color:var(--muted)}
.week .d{height:32px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;margin-top:4px}
.week .d svg{width:16px;height:16px;fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.week .d.on{background:var(--ok-bg);border-color:var(--ok)}
.week .d.fz{background:var(--frz-bg);border-color:var(--frz);color:var(--frz)}
.week .d.today{outline:2px solid var(--ink);outline-offset:1px}
.week .d.future{border-style:dashed;opacity:.4}
.cele{text-align:center;padding:26px 16px}
.cele .big{font-size:3.4rem;line-height:1}
.cele .n{font-size:1.5rem;font-weight:700;color:var(--fire);margin-top:8px}
@media (prefers-reduced-motion: no-preference){ .cele .big{animation:pop .6s ease-out} }
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.lgw{display:flex;gap:8px;overflow-x:auto;padding:2px}
.lgl{display:grid;grid-template-rows:repeat(7,22px);gap:4px;font-size:.72rem;color:var(--muted);line-height:22px}
.lg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,22px);gap:4px}
.cell{width:22px;height:22px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center}
.cell svg{width:15px;height:15px;fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cell.some svg{opacity:.5}
.cell.goal{background:var(--ok-bg);border-color:var(--ok)}
.cell.fz{background:var(--frz-bg);border-color:var(--frz)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{border-style:dashed;opacity:.35}
.dom{margin:14px 0}
.dom .top{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px;font-size:.95rem}
.reader{white-space:pre-wrap;line-height:1.8;font-size:.98rem;max-height:58vh;overflow:auto}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;max-width:90%;z-index:9;font-size:.92rem}
details{margin:12px 0}
summary{cursor:pointer;color:var(--muted)}
pre{background:var(--bg);padding:12px;border-radius:8px;overflow:auto;font-size:.8rem;line-height:1.5}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:6px 0;word-break:keep-all}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>
</head>

<main id="app"></main>
<nav class="tabs" aria-label="메뉴">
  <button data-act="tab" data-t="today">오늘</button>

<script>
window.CISA_BANK=[];
function CISA_BANK_ADD(d,arr,t){arr.forEach((x,i)=>CISA_BANK.push({id:'b'+d+(t||'')+'-'+String(i+1).padStart(3,'0'),d:d,q:x[0],ch:[x[1]].concat(x[2]),a:0,ex:x[3],s:t?'노트 기반 문제':'기본 문제'}))}
</script>

<script>
/* ---------- 기본 상수와 도구 ---------- */
const DOMAINS=[
  {id:1,name:'정보시스템 감사 프로세스',w:18},
  {id:2,name:'IT 거버넌스와 관리',w:18},
  {id:3,name:'정보시스템 취득, 개발, 구현',w:12},
  {id:4,name:'정보시스템 운영과 사업 복원력',w:26},
  {id:5,name:'정보자산 보호',w:26}
];
const MOCK={n:[9,9,6,13,13],min:80};
const INT=[0,1,3,7,14,30];
const KEY='cisa-routine-v1';
const TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>';
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const dkey=(d=new Date())=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays=(k,n)=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const fmt=m=>m<=0?'0분':m<1?'1분 미만':Math.round(m)+'분';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clampD=d=>{const n=parseInt(d);return n>=1&&n<=5?n:1};
const b64u=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};

const mkQ=(d,q,ch,a,ex,src)=>({id:uid(),d,q,ch,a,ex,box:0,due:dkey(),seen:0,right:0,last:null,src:src||''});
const mkC=(d,f,b,src)=>({id:uid(),d,f,b,box:0,due:dkey(),seen:0,src:src||''});

/* ---------- 저장소 ---------- */
function seed(){
  const S0={exam:'',goal:10,key:'',model:'gpt-4o-mini',qs:[],cards:[],log:{},reads:{}};
  const C=(d,f,b)=>S0.cards.push(mkC(d,f,b,'예제'));
  C(1,'고유위험, 통제위험, 적발위험','고유위험은 통제가 없을 때의 위험, 통제위험은 내부통제가 놓칠 위험, 적발위험은 감사인이 절차로도 못 찾을 위험입니다. 감사인이 조절할 수 있는 것은 적발위험뿐입니다.');
  C(1,'속성 표본과 변수 표본','속성 표본은 통제 이탈률(준거성 테스트), 변수 표본은 금액이나 수량 추정(실증 테스트)에 씁니다.');
  C(1,'ITGC의 통상적인 영역','접근 보안, 프로그램 변경, 프로그램 개발, 컴퓨터 운영(백업, 배치, 장애 대응)입니다.');
  C(1,'CISA 문제 접근법','"가장 먼저", "가장 적절한"에 맞춰 위험 기반으로 고릅니다. 기술 세부보다 통제 목적과 경영 관점을 먼저 봅니다.');
  C(2,'위험 대응 4가지','회피(활동 중단), 감소(통제 도입), 전가(보험, 외주), 수용(경영진 공식 승인)입니다.');
  C(2,'데이터 소유자와 관리자','소유자는 분류와 접근 승인을 책임지고, 관리자(custodian)는 소유자 요구에 따라 저장하고 보호합니다.');
  C(3,'변경 관리에서 꼭 남기는 증적','변경 요청, 권한자 승인, 테스트 결과와 사용자 승인, 이관 승인, 이관 이력입니다.');
  C(3,'시스템 전환 방식','직접 전환은 빠르지만 위험이 크고, 병렬 전환은 안전하지만 비용이 크며, 파일럿과 단계적 전환은 그 중간입니다.');
  C(4,'RTO, RPO, MTD','RTO는 복구 허용 시간, RPO는 허용 데이터 손실 시점, MTD는 최대 허용 중단 시간이며 RTO는 MTD보다 짧아야 합니다.');
  C(4,'백업 방식 비교','전체는 복구가 간단, 증분은 백업이 빠르지만 복구 시 모든 증분 필요, 차등은 전체와 최신 차등만 있으면 복구됩니다.');
  C(4,'핫, 웜, 콜드 사이트','핫은 즉시 전환하지만 비용이 가장 높고, 웜은 일부 설비만, 콜드는 공간과 기본 설비만 있어 복구가 가장 느립니다.');
  C(5,'공개키 사용 방향','암호화(기밀성)는 수신자 공개키, 전자서명은 송신자 개인키로 만들고 송신자 공개키로 검증합니다.');
  C(5,'IDS와 IPS','IDS는 탐지와 경보, IPS는 인라인으로 배치되어 탐지 후 차단까지 합니다.');
  C(5,'생체 인증 지표','FAR은 오수락률(보안상 가장 중요), FRR은 오거부율, CER은 둘이 같아지는 지점으로 낮을수록 정확합니다.');
  return S0;
}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.qs)s=seed();
  s.reads=s.reads||{};s.log=s.log||{};s.cards=s.cards||[];s.goal=s.goal||10;s.model=s.model||'gpt-4o-mini';
  s.frozen=s.frozen||{};s.freezes=s.freezes||0;s.remindHour=s.remindHour==null?21:s.remindHour;
  return s;
}
let S=load();
let statusTimer=0;
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요. 설정에서 백업을 내려받아 주세요.')}
  clearTimeout(statusTimer);statusTimer=setTimeout(writeStatus,300);
};

/* 기본 문제 은행 합치기: 진행 기록은 유지하고 문항 내용만 최신으로 */
function mergeBank(){
  const map=new Map(S.qs.map(x=>[x.id,x]));let n=0;
  (window.CISA_BANK||[]).forEach(b=>{
    const e=map.get(b.id);
    if(e){e.q=b.q;e.ch=b.ch;e.a=b.a;e.ex=b.ex;e.d=b.d}
    else{S.qs.push(Object.assign(mkQ(b.d,b.q,b.ch,b.a,b.ex,b.s),{id:b.id}));n++}
  });
  return n;
}

/* IndexedDB: PDF 원문(files)과 알림용 학습 상태(meta) */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('cisa-routine',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'name'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('files').objectStore('files').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbPut(store,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function dbDel(n){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(n);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
let FILES=[];

/* ---------- 연속 기록 ---------- */
const studied=k=>{const l=S.log[k];return !!l&&(l.q>0||l.min>=1||l.cards>0)};
const alive=k=>studied(k)||!!S.frozen[k];
function chainFrom(k){let n=0;while(alive(k)){n++;k=addDays(k,-1)}return n}
function streakN(){const t=dkey();return alive(t)?chainFrom(t):chainFrom(addDays(t,-1))}
function lastAlive(){
  const ks=Object.keys(S.log).filter(studied).concat(Object.keys(S.frozen)).sort();
  return ks.length?ks[ks.length-1]:'';
}
/* 놓친 날이 있으면 보호권을 자동으로 사용 */
function applyFreezes(){
  const t=dkey();if(S.freezeCheck===t)return;
  S.freezeCheck=t;
  let k=addDays(t,-1);const gaps=[];
  while(!alive(k)&&gaps.length<=S.freezes){gaps.push(k);k=addDays(k,-1)}
  if(gaps.length&&gaps.length<=S.freezes&&alive(k)){
    gaps.forEach(g=>S.frozen[g]=1);S.freezes-=gaps.length;
    ui.notice=`보호권 ${gaps.length}개를 써서 연속 기록을 지켰어요.`;
  }
  save();
}
/* 7일 연속마다 보호권 1개 (최대 2개) */
function awardFreeze(){
  const t=dkey(),n=streakN();
  if(studied(t)&&n>0&&n%7===0&&S.freezeAward!==t&&S.freezes<2){S.freezes++;S.freezeAward=t;ui.award=true}
}
async function writeStatus(){
  const last=lastAlive();
  try{await dbPut('meta',{id:'status',last,chain:last?chainFrom(last):0,freezes:S.freezes,goal:S.goal,updated:Date.now()})}catch(e){}
}

/* ---------- 상태 ---------- */
let tab='today', qs=null, cs=null, ui={gen:null,read:null,page:1,prog:'',notice:'',award:false,priv:'',sub:''};
const qItem=()=>S.qs.find(x=>x.id===qs.ids[qs.i]);
const cItem=()=>S.cards.find(x=>x.id===cs.ids[cs.i]);

function logAdd(min,q,right,cards=0){const k=dkey();const l=S.log[k]||(S.log[k]={min:0,q:0,right:0,cards:0});l.min+=min;l.q+=q;l.right+=right;l.cards=(l.cards||0)+cards;awardFreeze();save()}
function domStats(){return DOMAINS.map(d=>{const it=S.qs.filter(x=>x.d==d.id);const seen=it.filter(x=>x.seen>0);const tot=seen.reduce((a,x)=>a+x.seen,0),right=seen.reduce((a,x)=>a+x.right,0);return{...d,total:it.length,seen:seen.length,acc:tot?right/tot:null}})}

/* ---------- 문제 세션 ---------- */
function pickNew(pool,n){
  const by={};pool.filter(x=>!x.seen).forEach(x=>(by[x.d]||(by[x.d]=[])).push(x));
  Object.values(by).forEach(a=>shuffle(a));
  const st={};domStats().forEach(d=>st[d.id]=d);
  const res=[];
  while(res.length<n){
    const ds=Object.keys(by).filter(k=>by[k].length);if(!ds.length)break;
    const wts=ds.map(k=>st[k].w*(1.5-(st[k].acc==null?.5:st[k].acc)));
    let r=Math.random()*wts.reduce((a,b)=>a+b,0),i=0;
    while(r>wts[i]&&i<ds.length-1){r-=wts[i];i++}
    res.push(by[ds[i]].pop());
  }
  return res;
}
function buildQ(n,mode,dom){
  const t=dkey(),pool=S.qs.filter(x=>dom==='all'||x.d==dom),out=[];
  const take=a=>{for(const x of a){if(out.length>=n)break;if(!out.includes(x.id))out.push(x.id)}};
  if(mode==='wrong'){take(shuffle(pool.filter(x=>x.seen>0&&x.last===0)));return out}
  if(mode==='new'){take(pickNew(pool,n));return out}
  take(pool.filter(x=>x.seen>0&&x.due<=t).sort((a,b)=>a.due<b.due?-1:1));
  take(pickNew(pool,n-out.length));
  take(pool.filter(x=>x.seen>0).sort((a,b)=>a.box-b.box));
  return out;
}
function newSession(ids,mock){
  qs={ids,i:0,right:0,active:0,done:false,wrong:[],res:[],mock:!!mock,was:studied(dkey())};
  if(mock)qs.deadline=Date.now()+MOCK.min*60000;
  prepQ();tab='quiz';render(true);
}
function startQ(n,mode='auto',dom='all'){
  const ids=buildQ(n,mode,dom);
  if(!ids.length){toast(mode==='wrong'?'다시 풀 오답이 없어요.':'풀 문제가 없어요.');return}

}
function startMock(){

  if(ids.length<10){toast('모의고사를 만들 문제가 부족해요.');return}
  newSession(shuffle(ids),true);
}
function prepQ(){const it=qItem();qs.perm=shuffle(it.ch.map((_,i)=>i));qs.picked=null;qs.ai='';qs.t0=Date.now()}
function answer(d){
  if(!qs||qs.picked!==null||qs.done)return;
  const it=qItem(),ok=qs.perm[d]===it.a,dt=Math.min(Date.now()-qs.t0,120000)/60000;
  qs.picked=d;qs.active+=dt;it.seen++;
  if(ok){it.right++;qs.right++}else qs.wrong.push(it.id);
  qs.res.push({d:it.d,ok});
  it.last=ok?1:0;it.box=ok?Math.min((it.box||0)+1,5):0;it.due=addDays(dkey(),INT[it.box]);
  logAdd(dt,1,ok?1:0);render();
}
function nextQ(){if(qs.i+1>=qs.ids.length){qs.done=true}else{qs.i++;prepQ()}render(true)}

/* ---------- 카드 세션 ---------- */
function buildC(n){
  const t=dkey(),out=[];
  const take=a=>{for(const x of a){if(out.length>=n)break;if(!out.includes(x.id))out.push(x.id)}};
  take(S.cards.filter(x=>x.seen>0&&x.due<=t).sort((a,b)=>a.due<b.due?-1:1));
  take(shuffle(S.cards.filter(x=>!x.seen)));
  take(S.cards.filter(x=>x.seen>0).sort((a,b)=>a.box-b.box));
  return out;
}
function startC(n){
  const ids=buildC(n);
  if(!ids.length){toast('카드가 없어요. 카드를 추가하거나 가져와 주세요.');return}
  cs={ids,i:0,known:0,active:0,shown:false,done:false,t0:Date.now(),was:studied(dkey())};tab='cards';render(true);
}
function rateC(ok){
  const c=cItem(),dt=Math.min(Date.now()-cs.t0,120000)/60000;
  cs.active+=dt;c.seen++;if(ok)cs.known++;
  c.box=ok?Math.min((c.box||0)+1,5):0;c.due=addDays(dkey(),INT[c.box]);
  logAdd(dt,0,0,1);
  if(cs.i+1>=cs.ids.length)cs.done=true;else{cs.i++;cs.shown=false;cs.t0=Date.now()}
  render(true);
}

async function gpt(system,user,json=true){
  if(!S.key)throw new Error('설정 탭에서 OpenAI API 키를 먼저 입력해 주세요.');
  const body={model:S.model,messages:[{role:'system',content:system},{role:'user',content:user}]};

  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},body:JSON.stringify(body)});

}

/* ---------- PDF ---------- */
async function extractPdf(file,onp){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    pages.push(tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').trim());
    onp(i,doc.numPages);
  }
  return pages;
}
async function addPdfs(fileList){
  const files=[...fileList];
  if(typeof pdfjsLib==='undefined'){toast('PDF 처리 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return}
  for(const file of files){
    try{
      ui.prog=`${file.name} 읽는 중...`;render();
      const pages=await extractPdf(file,(i,n)=>{if(i%5===0||i===n){ui.prog=`${file.name} ${i}/${n}쪽`;const p=$('#prog');if(p)p.textContent=ui.prog}});
      if(pages.join('').replace(/\s/g,'').length<100){toast(`${file.name}: 글자를 찾지 못했어요. 스캔본이면 OCR 처리한 PDF를 올려 주세요.`);continue}
      const rec={name:file.name,pages,added:dkey()};
      await dbPut('files',rec);FILES=FILES.filter(f=>f.name!==rec.name).concat(rec);
    }catch(err){toast(`${file.name} 처리 실패: ${err.message||err}`)}
  }
  ui.prog='';render();
}

const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function genVapid(){
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey));
  const jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  S.vapidPub=b64u(raw);ui.priv=jwk.d;ui.sub='';save();
}
async function subscribe(){
  if(!pushOK()){toast('이 브라우저는 푸시 알림을 지원하지 않아요. 아이폰은 홈 화면에 추가한 뒤 그 아이콘으로 열어 주세요.');return}
  if(!S.vapidPub){toast('먼저 알림 키를 만들어 주세요.');return}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('알림 권한이 허용되지 않았어요. 기기 설정에서 허용해 주세요.');return}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  const want=u8(S.vapidPub);
  if(sub){
    const have=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;
    if(!have||have.length!==want.length||have.some((v,i)=>v!==want[i])){await sub.unsubscribe();sub=null}
  }
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:want});
  ui.sub=JSON.stringify(sub);writeStatus();render();
}

function weekStrip(){

  return `<div class="week">${names.map((nm,i)=>{const k=addDays(mon,i);let c='d',inner='';

function ledger(){
  const t=dkey(),wd=(new Date().getDay()+6)%7,W=10,start=addDays(t,-(wd+7*(W-1)));let h='';
  for(let c=0;c<W;c++)for(let r=0;r<7;r++){

    case 'quit':if(!qs.mock||confirm('지금 제출할까요? 안 푼 문제는 채점하지 않아요.')){qs.done=true;render(true)}return;
    case 'again-wrong':startQ(10,'wrong');return;
    case 'end':qs=null;cs=null;tab='today';render(true);return;
    case 'ai':await aiExplain();return;
    case 'startc':startC(+b.dataset.n);return;
    case 'cflip':cs.shown=true;render();return;
    case 'cok':rateC(true);return;
    case 'cagain':rateC(false);return;
    case 'cquit':cs.done=true;render(true);return;
    case 'addcard':{
      const f=$('#nc-f').value.trim(),bk=$('#nc-b').value.trim();
      if(!f||!bk){toast('앞면과 뒷면을 모두 입력해 주세요.');return}
      S.cards.push(mkC(+$('#nc-d').value,f,bk,'직접 입력'));save();toast('카드를 추가했어요.');render();return}
    case 'gopen':ui.gen=ui.gen===b.dataset.f?null:b.dataset.f;render();return;
    case 'gclose':ui.gen=null;render();return;
    case 'grun':await runGen(b);return;
    case 'ropen':ui.read=b.dataset.f;ui.page=S.reads[ui.read]||1;ui.hits=null;ui.q='';readT=Date.now();render(true);return;
    case 'rprev':case 'rnext':{
      readerTick();const f=FILES.find(x=>x.name===ui.read);
      ui.page=Math.min(f.pages.length,Math.max(1,ui.page+(a==='rnext'?1:-1)));S.reads[f.name]=ui.page;save();render(true);return}
    case 'rgo':{
      const f=FILES.find(x=>x.name===ui.read),n=parseInt($('#rp').value);
      if(!n){toast('이동할 쪽 번호를 입력해 주세요.');return}
      readerTick();ui.page=Math.min(f.pages.length,Math.max(1,n));S.reads[f.name]=ui.page;save();render(true);return}
    case 'rfind':{
      const f=FILES.find(x=>x.name===ui.read),q=$('#rq').value.trim().toLowerCase();
      if(!q){toast('검색어를 입력해 주세요.');return}
      ui.q=q;ui.hits=[];
      f.pages.forEach((t,i)=>{const k=t.toLowerCase().indexOf(q);if(k>=0){const st=Math.max(0,k-25);ui.hits.push({p:i+1,s:t.slice(st,k+q.length+45).replace(/\s+/g,' ')})}});
      render();return}
    case 'rjump':{
      const f=FILES.find(x=>x.name===ui.read);
      readerTick();ui.page=Math.min(f.pages.length,Math.max(1,+b.dataset.p));S.reads[f.name]=ui.page;save();render(true);return}
    case 'rclose':readerTick();readT=0;ui.read=null;ui.hits=null;ui.q='';render(true);return;
    case 'fdel':if(confirm('이 자료를 삭제할까요? 이미 만든 문제와 카드는 남아요.')){await dbDel(b.dataset.f);FILES=FILES.filter(f=>f.name!==b.dataset.f);delete S.reads[b.dataset.f];save();if(ui.gen===b.dataset.f)ui.gen=null;render()}return;
    case 'saveset':
      S.exam=$('#s-exam').value;S.goal=Math.max(1,+$('#s-goal').value||10);S.key=$('#s-key').value.trim();S.model=$('#s-model').value.trim()||'gpt-4o-mini';
      save();toast('저장했어요.');render();return;
    case 'vapid':
      if(S.vapidPub&&!confirm('키를 새로 만들면 GitHub에 등록한 값과 모든 기기의 알림 등록을 다시 해야 해요. 계속할까요?'))return;
      await genVapid();render();return;
    case 'psub':b.disabled=true;await subscribe();return;
    case 'ntest':await testNotif();return;
    case 'copy':await copy({pub:S.vapidPub,priv:ui.priv,sub:ui.sub}[b.dataset.v]||'');return;
    case 'export':{const {key,...rest}=S;download(`cisa-backup-${dkey()}.json`,rest);return}
    case 'reset':if(confirm('문제, 카드, 학습 기록을 모두 지우고 처음 상태로 돌릴까요?')&&confirm('정말 지울까요? 되돌릴 수 없어요.')){const k=S.key,vp=S.vapidPub;S=seed();S.key=k;S.vapidPub=vp;S.frozen={};S.freezes=0;S.remindHour=21;mergeBank();save();qs=null;cs=null;toast('초기화했어요.');render(true)}return;
  }
  }catch(err){toast(err.message||'문제가 생겼어요. 다시 시도해 주세요.');render()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='s-hour'){S.remindHour=+el.value;save();toast(`${el.value}시로 바꿨어요.`);return}
  if(el.id==='pdfin'){await addPdfs(el.files);return}
  if(el.id==='impitems'||el.id==='impbackup'){
    const f=el.files[0];if(!f)return;
    try{
      const o=JSON.parse(await f.text());
      if(el.id==='impitems'){const[nq,nc]=importItems(o);toast(`문제 ${nq}개, 카드 ${nc}장을 가져왔어요.`)}
      else{if(!Array.isArray(o.qs)||!Array.isArray(o.cards))throw new Error('bad');S=Object.assign(S,o,{key:S.key});S.frozen=S.frozen||{};S.freezes=S.freezes||0;mergeBank();save();toast('백업을 불러왔어요.')}
    }catch(err){toast('파일 형식을 확인해 주세요.')}
    el.value='';render();
  }
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  if(tab==='quiz'&&qs&&!qs.done){
    if(qs.picked===null&&/^[1-4]$/.test(e.key)&&+e.key<=qs.perm.length)answer(+e.key-1);
    else if(qs.picked!==null&&e.key==='Enter')nextQ();
  }else if(tab==='cards'&&cs&&!cs.done&&(e.key===' '||e.key==='Enter')){
    e.preventDefault();if(!cs.shown){cs.shown=true;render()}
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){const before=S.freezeCheck;applyFreezes();if(before!==S.freezeCheck&&!(qs&&!qs.done)&&!(cs&&!cs.done))render();localRemind()}
});
/* 모의고사 타이머와 알림 확인 */
setInterval(()=>{
  if(qs&&qs.mock&&!qs.done){
    if(Date.now()>=qs.deadline){qs.done=true;toast('시간이 끝나 자동으로 제출했어요.');if(tab==='quiz')render(true)}
    else{const t=$('#timer');if(t){t.textContent=remain();t.classList.toggle('low',qs.deadline-Date.now()<5*60000)}}
  }
},1000);
setInterval(localRemind,60000);

/* ---------- 시작 ---------- */
const hadData=S.qs.length>0;
const added=mergeBank();
applyFreezes();
save();
if(added&&hadData)toast(`기본 문제 ${added}개를 추가했어요.`);
render();
dbAll().then(f=>{FILES=f;if(tab==='src')render()}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>localRemind()).catch(()=>{});
</script>
</body>
</html>
